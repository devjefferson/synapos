name: "Descoberta → Requisitos → Spec → Handoff"
description: "Para ideias pouco definidas: brainstorm do problema → (pesquisa opcional) → requisitos tipados → aprovação → spec → (visual opcional) → handoff contratual para dev."
version: "2.0.0"

# Artefatos na session: brainstorm.md → requirements.md → spec.md → [visual-spec.md] → handoff.md
# O squad de desenvolvimento que abrir esta mesma feature lê handoff.md/spec.md na investigação.

steps:
  - id: 01-gate-integridade
    name: "Verificação de Integridade"
    execution: checkpoint
    gate: GATE-0
    file: pipeline/steps/01-gate-integridade.md

  - id: pd-02-brainstorm
    name: "Brainstorm — do pedido ao problema"
    agent: priscila-produto
    execution: inline
    model_tier: powerful
    file: pipeline/steps/pd-02-brainstorm.md
    depends_on: [01-gate-integridade]
    output_files:
      - brainstorm.md
    output_schema:
      required_sections: ["Problema", "Usuário", "Objetivo", "Escopo v1"]
    veto_conditions:
      - "Primeira ideia do usuário aceita sem explorar problema, usuário e alternativas"
      - "Dado de mercado, métrica ou persona sem fonte (usuário, doc ou pesquisa com link)"
      - "Resumo da Descoberta não confirmado pelo usuário"

  - id: 02-contexto-negocio
    name: "Pesquisa (opcional)"
    agent: paulo-pesquisa
    execution: subagent
    model_tier: powerful
    tracks: [complex]
    file: pipeline/steps/02-contexto-negocio.md
    depends_on: [pd-02-brainstorm]
    skip_condition: "Não há skill de busca web disponível, paulo-pesquisa não está no squad, ou o usuário não pediu pesquisa no brainstorm"
    output_files:
      - research/market-analysis.md
    veto_conditions:
      - "Afirmação de mercado sem link/fonte (sem fonte → marcar como hipótese)"

  - id: 06-requisitos
    name: "Requisitos"
    agent: ana-analise
    execution: subagent
    model_tier: powerful
    file: pipeline/steps/06-requisitos.md
    depends_on: [pd-02-brainstorm]
    output_files:
      - requirements.md
    output_schema:
      required_sections:
        - "## Requisitos Funcionais"
        - "## Regras de Negócio"
        - "## Critérios de Aceite"
    veto_conditions:
      - "RF sem critério de aceite Dado/Quando/Então"
      - "Valor numérico que não veio do usuário, da spec ou do projeto"
      - "Requisito sem prioridade P0/P1/P2"
    on_reject: 06-requisitos

  - id: pd-07-checkpoint-requisitos
    name: "Aprovação dos Requisitos"
    execution: checkpoint
    file: pipeline/steps/06b-checkpoint-requisitos.md
    depends_on: [06-requisitos]

  - id: 05-spec
    name: "Spec"
    agent: priscila-produto
    execution: subagent
    model_tier: powerful
    file: pipeline/steps/05-spec.md
    depends_on: [pd-07-checkpoint-requisitos]
    output_files:
      - spec.md
    veto_conditions:
      - "Spec sem seção IN/OUT de escopo"
      - "Conteúdo novo que não rastreia para brainstorm.md, requirements.md ou decisão do usuário"
    on_reject: 05-spec

  - id: 06c-visual-spec
    name: "Especificação Visual"
    agent: ursula-ux
    execution: subagent
    model_tier: powerful
    file: pipeline/steps/06c-visual-spec.md
    depends_on: [05-spec]
    gate: GATE-DESIGN
    skip_condition: "A feature não tem UI ou ursula-ux não está nos agents do squad"
    output_files:
      - visual-spec.md
    veto_conditions:
      - "visual-spec.md sem seção de Verificação GATE-DESIGN"
      - "Token, cor ou componente que não existe no design system do projeto"
      - "Estado vazio ou de erro ausente em lista/formulário"

  - id: 08-handoff
    name: "Handoff para Desenvolvimento"
    agent: tania-tecnica
    execution: subagent
    model_tier: powerful
    file: pipeline/steps/08-handoff.md
    depends_on: [05-spec]
    gate: GATE-HANDOFF
    output_files:
      - handoff.md
