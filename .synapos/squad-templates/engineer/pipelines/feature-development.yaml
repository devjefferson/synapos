name: "Feature Development"
description: "Investigação → Arquitetura → Planejamento → Execução guiada por ADRs. Checkpoint consolidado antes de iniciar a execução."
version: "3.0.0"

# Arquivos de sessão gerados neste pipeline.
# Salvos em: docs/.squads/sessions/{feature-slug}/
# O pipeline-runner injeta automaticamente esses arquivos
# no contexto de todos os steps subsequentes.
session_files:
  context: context.md
  architecture: architecture.md
  plan: plan.md

# v2.0: Checkpoints intermediários (pós-contexto, pós-arquitetura, pós-plano)
# foram consolidados em um único checkpoint final antes da execução.
steps:
  - id: 01-gate-integridade
    name: "Verificação de Integridade"
    execution: checkpoint
    gate: GATE-0
    file: pipeline/steps/01-gate.md

  - id: 02-preparacao
    name: "Preparação"
    agent: leo-engenheiro
    execution: inline
    model_tier: fast
    file: pipeline/steps/02-preparacao.md
    depends_on: [01-gate-integridade]

  - id: 03-investigacao
    name: "Investigação"
    agent: leo-engenheiro
    execution: inline
    model_tier: powerful
    needs_spec: true
    file: pipeline/steps/03-investigacao.md
    depends_on: [02-preparacao]
    output_files:
      - context.md
    output_schema:
      required_sections: ["## Resumo", "## Motivação", "## Meta", "## Escopo", "## ADRs Relevantes", "## Validação"]
    veto_conditions:
      - "Meta sem resultado verificável"
      - "Pergunta já respondida por spec.md/handoff.md repetida ao usuário"
      - "Questões críticas não respondidas pelo humano antes de salvar"

  - id: 04-padroes
    name: "Descoberta de Padrões"
    agent: leo-engenheiro
    execution: inline
    model_tier: powerful
    file: ../../core/shared-steps/pattern-discovery.md
    depends_on: [03-investigacao]
    veto_conditions:
      - "Âncora de padrão com resposta sem caminho de evidência e sem [CONTEXT_REQUIRED]"

  - id: 05-arquitetura
    name: "Estruturação Arquitetural"
    agent: leo-engenheiro
    execution: subagent
    model_tier: powerful
    needs_full_context: true
    file: pipeline/steps/05-arquitetura.md
    depends_on: [04-padroes]
    output_files:
      - architecture.md
    output_schema:
      required_sections: ["## Referência no Projeto", "## Principais Arquivos a Modificar/Criar", "## ADRs Aplicadas", "## Verificação de Consistência"]
    veto_conditions:
      - "Arquivo, componente ou abstração nova sem justificativa de por que o existente não serve"
      - "Decisão técnica tomada sem apresentar como [DECISÃO PENDENTE] ao humano"

  - id: 07-planejamento
    name: "Planejamento de Execução"
    agent: leo-engenheiro
    execution: subagent
    model_tier: powerful
    tracks: [complex]
    file: pipeline/steps/07-planejamento.md
    depends_on: [05-arquitetura]
    output_files:
      - plan.md
    veto_conditions:
      - "plan.md sem agents/skills atribuídos por fase"
      - "Alguma fase excede estimativa de 2h sem justificativa"
      - "Dependências sequenciais/paralelas não documentadas"

  - id: 08-checkpoint-final
    name: "Aprovação Consolidada (Contexto + Arquitetura + Plano)"
    execution: checkpoint
    gate: GATE-ADR
    file: pipeline/steps/checkpoint-final.md
    depends_on: [05-arquitetura]

  - id: 09-execucao
    name: "Execução por Fases"
    agent: leo-engenheiro
    execution: inline
    model_tier: powerful
    file: pipeline/steps/09-execucao.md
    depends_on: [08-checkpoint-final]
    gate: GATE-5

  - id: update-task
    name: "Atualizar Tarefa no Linear"
    execution: checkpoint
    file: ../../core/shared-steps/update-task.md
    depends_on: [09-execucao]
